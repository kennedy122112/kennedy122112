name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2563EB&color_dots=#ebedf0,#bae6fd,#38BDF8,#2563EB,#1E3A8A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#06B6D4&color_dots=#161b22,#0c4a6e,#0369a1,#2563EB,#38BDF8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
