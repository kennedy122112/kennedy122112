name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#C026D3&color_dots=#ebedf0,#f5d0fe,#e879f9,#c026d3,#7c3aed
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#EC4899&color_dots=#161b22,#4a044e,#86198f,#c026d3,#e879f9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
